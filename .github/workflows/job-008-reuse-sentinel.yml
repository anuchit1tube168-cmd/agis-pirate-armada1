name: JOB-008 SENTINEL Reuse Retest

on:
  push:
    branches:
      - staging/job-008-e1-3d-20260922
    paths:
      - 'experiments/e1-reuse-staging/**'
      - 'experiments/e1-3d-staging/src/state.ts'
      - '.github/workflows/job-008-reuse-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel-reuse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/e1-reuse-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean dependency install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck reused boundary consumer
        run: npm run typecheck
      - name: Deterministic reuse test
        run: npm test
      - name: Build gate
        run: npm run build
