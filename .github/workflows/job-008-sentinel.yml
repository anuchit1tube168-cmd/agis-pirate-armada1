name: JOB-008 SENTINEL Reproducibility

on:
  push:
    branches:
      - staging/job-008-e1-3d-20260922
    paths:
      - 'experiments/e1-3d-staging/**'
      - '.github/workflows/job-008-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/e1-3d-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean dependency install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Deterministic tests
        run: npm test
      - name: Production build
        run: npm run build
