name: JOB-009 3D Reuse Retest
on:
  push:
    paths:
      - 'experiments/e1-3d-retest-2/**'
      - '.github/workflows/job009-retest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/e1-3d-retest-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/e1-3d-retest-2/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Static fallback and reduced-motion assertions
        run: |
          grep -q "prefers-reduced-motion" src/main.ts
          grep -q "showFallback" src/main.ts
          grep -q "3D unavailable" src/ui.ts
          grep -q "TOGGLE_WIREFRAME" src/input.ts
